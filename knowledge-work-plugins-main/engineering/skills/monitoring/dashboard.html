<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Service Monitor</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #202b3c;
      background: #f3f6fa;
      --muted: #64748b;
      --border: #dce4ee;
      --green: #147d52;
      --red: #b42318;
      --amber: #9a6700;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(1120px, 100%); margin: 0 auto; padding: 32px 20px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2rem); }
    p { margin: 4px 0 0; color: var(--muted); }
    button { border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 9px 14px; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #f8fafc; }
    button:focus-visible { outline: 3px solid #85b7ff; outline-offset: 2px; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
    .summary article, .endpoint { background: #fff; border: 1px solid var(--border); border-radius: 12px; }
    .summary article { padding: 16px 18px; }
    .summary span { color: var(--muted); font-size: .9rem; }
    .summary strong { display: block; font-size: 1.65rem; }
    #endpoint-list { display: grid; gap: 12px; }
    .endpoint { padding: 18px; }
    .endpoint-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
    .badge { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 4px 10px; font-size: .82rem; font-weight: 650; text-transform: capitalize; }
    .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .up { color: var(--green); background: #e8f5ee; }
    .down { color: var(--red); background: #fcebea; }
    .unknown { color: var(--amber); background: #fff5d6; }
    .endpoint-url { margin: 8px 0 14px; overflow-wrap: anywhere; font-size: .9rem; }
    .details { display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--muted); font-size: .87rem; }
    .error { color: var(--red); }
    .history { display: flex; align-items: center; gap: 3px; height: 28px; margin-top: 12px; }
    .history span { flex: 1; min-width: 2px; max-width: 12px; height: 14px; border-radius: 2px; background: #d9e1eb; }
    .history .history-up { background: #24936a; }
    .history .history-down { background: #d0443b; }
    .empty, .error-banner { border: 1px solid var(--border); border-radius: 10px; padding: 16px; background: #fff; color: var(--muted); }
    .error-banner { margin-bottom: 16px; color: var(--red); }
    footer { margin-top: 18px; color: var(--muted); font-size: .85rem; }
    @media (max-width: 560px) {
      main { padding: 22px 14px; }
      header { align-items: flex-start; }
      .summary { gap: 8px; }
      .summary article { padding: 12px; }
      .summary span { font-size: .8rem; }
      .summary strong { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Service monitor</h1>
        <p id="last-updated" aria-live="polite">Waiting for the first health check…</p>
      </div>
      <button id="refresh" type="button">Refresh now</button>
    </header>
    <p id="load-error" class="error-banner" role="alert" hidden></p>
    <section class="summary" aria-label="Service summary">
      <article><span>Total services</span><strong id="total-count">—</strong></article>
      <article><span>Healthy</span><strong id="up-count">—</strong></article>
      <article><span>Unhealthy</span><strong id="down-count">—</strong></article>
    </section>
    <section id="endpoint-list" aria-label="Monitored services" aria-live="polite">
      <p class="empty">Loading service status…</p>
    </section>
    <footer>Checks refresh automatically every 5 seconds. The monitor only runs while its local process is open.</footer>
  </main>
  <script>
    const list = document.querySelector("#endpoint-list");
    const errorBanner = document.querySelector("#load-error");
    let refreshing = false;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(data) {
      document.querySelector("#total-count").textContent = data.summary.total;
      document.querySelector("#up-count").textContent = data.summary.up;
      document.querySelector("#down-count").textContent = data.summary.down;
      document.querySelector("#last-updated").textContent = data.checkedAt
        ? `Last health check: ${new Date(data.checkedAt).toLocaleString()}`
        : "Waiting for the first health check…";

      list.replaceChildren();
      if (!data.endpoints.length) {
        list.append(element("p", "empty", "No endpoints are configured."));
        return;
      }

      for (const endpoint of data.endpoints) {
        const card = element("article", "endpoint");
        const heading = element("div", "endpoint-heading");
        heading.append(element("h2", "", endpoint.name));
        heading.append(element("span", `badge ${endpoint.status}`, endpoint.status));
        card.append(heading);
        card.append(element("p", "endpoint-url", endpoint.url));

        const details = element("div", "details");
        details.append(element("span", "", endpoint.latencyMs === null ? "Latency: —" : `Latency: ${endpoint.latencyMs} ms`));
        details.append(element("span", "", `Consecutive failures: ${endpoint.consecutiveFailures}`));
        details.append(element("span", "", `Checks: ${endpoint.totalChecks}`));
        details.append(element("span", "", endpoint.lastCheckedAt
          ? `Checked: ${new Date(endpoint.lastCheckedAt).toLocaleTimeString()}`
          : "Not checked yet"));
        card.append(details);
        if (endpoint.lastError) card.append(element("p", "error", endpoint.lastError));

        const history = element("div", "history");
        history.setAttribute("role", "img");
        history.setAttribute("aria-label", `${endpoint.history.length} recent checks; ${endpoint.history.filter(item => item.up).length} healthy`);
        for (const item of endpoint.history) {
          const bar = element("span", item.up ? "history-up" : "history-down");
          bar.title = `${item.checkedAt}: ${item.up ? "healthy" : "unhealthy"}`;
          history.append(bar);
        }
        card.append(history);
        list.append(card);
      }
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      const button = document.querySelector("#refresh");
      button.disabled = true;
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error(`Status API returned HTTP ${response.status}`);
        const data = await response.json();
        if (!data || !data.summary || !Array.isArray(data.endpoints)) throw new Error("Status API returned an invalid response");
        render(data);
        errorBanner.hidden = true;
      } catch (error) {
        errorBanner.textContent = `Unable to load monitor status: ${error.message}`;
        errorBanner.hidden = false;
      } finally {
        button.disabled = false;
        refreshing = false;
      }
    }

    document.querySelector("#refresh").addEventListener("click", refresh);
    refresh();
    window.setInterval(refresh, 5000);
  </script>
</body>
</html>
